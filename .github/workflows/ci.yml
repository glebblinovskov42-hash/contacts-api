ame: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install dependencies
        run: go mod download

      - name: Run unit-test
        run: make unit-test

      - name: Run e2e-test
        run: make e2e-test

      - name: Build
        run: go build -o bin/app ./cmd/api